<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu des Compteurs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            user-select: none;
        }

        /* Chaque ligne prend 50% de la hauteur de l'écran */
        .counter-row {
            display: flex;
            flex: 1;
            border-bottom: 2px solid #dee2e6;
        }

        .counter-row:last-child {
            border-bottom: none;
        }

        /* Section de gauche pour l'image */
        .left-panel {
            width: 35%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #e9ecef;
        }

        .left-panel img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .left-panel img:active {
            transform: scale(0.95);
        }

        /* Section de droite pour le compteur */
        .right-panel {
            width: 65%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }

        .counter-display {
            font-size: 6rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            padding: 20px 40px;
            border-radius: 12px;
            transition: transform 0.1s ease, color 0.2s ease;
        }

        .counter-display:hover {
            color: #dc3545;
        }

        .counter-display:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Ligne du haut : Token -->
    <div class="counter-row">
        <div class="left-panel">
            <img src="token.png" alt="Token" id="token-img" title="Cliquer pour ajouter 1">
        </div>
        <div class="right-panel">
            <div class="counter-display" id="token-counter" title="Cliquer pour enlever 1">0</div>
        </div>
    </div>

    <!-- Ligne du bas : Coffre -->
    <div class="counter-row">
        <div class="left-panel">
            <img src="coffre.png" alt="Coffre au trésor" id="chest-img" title="Cliquer pour ajouter 1">
        </div>
        <div class="right-panel">
            <div class="counter-display" id="chest-counter" title="Cliquer pour enlever 1">0</div>
        </div>
    </div>

    <script>
        // Fonction générique pour gérer un compteur avec son image et sa clé de stockage
        function initCounter(imgId, counterId, storageKey) {
            const imgElement = document.getElementById(imgId);
            const counterElement = document.getElementById(counterId);

            let count = parseInt(localStorage.getItem(storageKey)) || 0;
            counterElement.textContent = count;

            function updateCounter(newValue) {
                count = newValue;
                counterElement.textContent = count;
                localStorage.setItem(storageKey, count);
            }

            // Clic sur l'image : Ajoute 1
            imgElement.addEventListener('click', () => {
                updateCounter(count + 1);
            });

            // Clic sur le compteur : Enlève 1
            counterElement.addEventListener('click', () => {
                updateCounter(count - 1);
            });
        }

        // Initialisation des deux compteurs indépendants
        initCounter('token-img', 'token-counter', 'tokenCount');
        initCounter('chest-img', 'chest-counter', 'chestCount');
    </script>

</body>
</html>
